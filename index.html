<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Orlando</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: 'Arial', sans-serif; overflow-x: hidden; }

  /* NAV */
  .navbar {
    position: sticky; top: 0; z-index: 1000;
    width: 100%;
    background: #071E5C;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 70px;
  }
  .navbar img { height: 50px; cursor: pointer; }
  .nav-links { display: flex; gap: 30px; align-items: center; }
  .nav-links a {
    color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 600; letter-spacing: 1px;
    cursor: pointer; transition: opacity 0.2s;
  }
  .nav-links a:hover { opacity: 0.7; }
  .nav-sep { color: rgba(255,255,255,0.4); }

  /* HERO */
  .hero { width: 100%; }
  .hero img { width: 100%; display: block; }

  /* SECTIONS */
  .section { width: 100%; }
  .section img { width: 100%; display: block; }

  /* COUNTDOWN SECTION */
  .countdown-section {
    background: #fff;
    padding: 60px 20px 40px;
    text-align: center;
  }
  .countdown-section h3 {
    color: #071E5C; font-size: 14px; letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 8px; font-weight: 700;
  }
  .countdown-section h2 {
    color: #071E5C; font-size: 32px; font-weight: 900;
    text-transform: uppercase; margin-bottom: 30px; letter-spacing: 2px;
  }
  .countdown {
    display: flex; justify-content: center; gap: 20px;
    flex-wrap: wrap; max-width: 700px; margin: 0 auto;
  }
  .cd-box {
    background: #071E5C; color: #fff;
    border-radius: 8px; padding: 20px 25px;
    min-width: 110px;
    box-shadow: 0 8px 24px rgba(7,30,92,0.2);
  }
  .cd-num {
    font-size: 48px; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .cd-label {
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; margin-top: 6px; opacity: 0.85;
  }

  /* VIDEO SECTION */
  .video-section {
    background: #fff;
    padding: 60px 20px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .video-section h2 {
    color: #071E5C; font-size: 14px; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 10px; opacity: 0.8;
  }
  .video-section h1 {
    color: #071E5C; font-size: 36px; font-weight: 900;
    text-transform: uppercase; margin-bottom: 40px; letter-spacing: 2px;
  }
  .video-wrapper {
    width: 100%; max-width: 800px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(7,30,92,0.25);
  }
  .video-wrapper video { width: 100%; display: block; }

  /* SPEAKERS SLIDER */
  .speakers-section { position: relative; overflow: hidden; background: #fff; }
  .speakers-track { display: flex; transition: transform 0.6s cubic-bezier(.4,0,.2,1); }
  .speaker-slide { min-width: 100%; }
  .speaker-slide img { width: 100%; display: block; }

  /* Minimal next-arrow */
  .speaker-next {
    position: absolute; top: 50%; right: 4%;
    transform: translateY(-50%);
    width: 48px; height: 48px;
    background: none; border: none;
    cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, opacity 0.2s;
    opacity: 0.7;
  }
  .speaker-next:hover { opacity: 1; transform: translateY(-50%) translateX(4px); }
  .speaker-next svg { width: 32px; height: 32px; stroke: #071E5C; fill: none; stroke-width: 1.5; }
  @media (max-width: 768px) {
    .speaker-next { width: 36px; height: 36px; right: 5%; }
    .speaker-next svg { width: 24px; height: 24px; }
  }

  /* CONTACT / WHATSAPP SECTION */
  .contact-section {
    background: #fff;
    padding: 70px 20px;
    text-align: center;
  }
  .contact-section h3 {
    color: #071E5C; font-size: 14px; letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 8px; font-weight: 700;
  }
  .contact-section h2 {
    color: #071E5C; font-size: 32px; font-weight: 900;
    text-transform: uppercase; margin-bottom: 30px; letter-spacing: 2px;
  }
  .wa-cta {
    display: inline-flex; align-items: center; gap: 14px;
    background: #25D366; color: #fff;
    padding: 20px 36px;
    border-radius: 50px; text-decoration: none;
    font-size: 18px; font-weight: 700; letter-spacing: 1px;
    box-shadow: 0 10px 30px rgba(37,211,102,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .wa-cta:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(37,211,102,0.55);
  }
  .wa-cta svg { width: 28px; height: 28px; fill: #fff; }

  /* WHATSAPP FLOAT */
  .wa-btn {
    position: fixed; bottom: 5%; right: 4%; z-index: 500;
    width: 90px; height: 90px;
    background: #25D366; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(37,211,102,0.45);
    cursor: pointer; transition: transform 0.2s;
    text-decoration: none;
  }
  .wa-btn:hover { transform: scale(1.08); }
  .wa-btn svg { width: 50px; height: 50px; fill: #fff; }
  .wa-btn::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid #25D366;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* FOOTER */
  .footer {
    background: #071E5C;
    padding: 20px 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .footer img { height: 40px; }

  @media (max-width: 768px) {
    .navbar { padding: 0 16px; }
    .nav-links { gap: 12px; }
    .nav-links a { font-size: 10px; letter-spacing: 0.5px; }
    .video-section h1, .countdown-section h2, .contact-section h2 { font-size: 24px; }
    .cd-box { min-width: 75px; padding: 14px 12px; }
    .cd-num { font-size: 32px; }
    .countdown { gap: 10px; }
    .wa-btn { width: 70px; height: 70px; }
    .wa-btn svg { width: 38px; height: 38px; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <img src="assets/asset_png_001.png" alt="American Express" style="height:50px;object-fit:contain;">
  <div class="nav-links">
    <a onclick="scrollToSection('mission')">MISSION SCHEDULE</a>
    <span class="nav-sep">|</span>
    <a onclick="scrollToSection('kennedy')">KENNEDY SPACE CENTER</a>
    <span class="nav-sep">|</span>
    <a onclick="scrollToSection('moments')">MOMENTS FROM THE MISSION</a>
  </div>
</nav>

<!-- HERO BANNER -->
<div class="hero">
  <img src="assets/asset_gif_001.gif" alt="Workshop Orlando">
</div>

<!-- COUNTDOWN -->
<div class="countdown-section">
  <h3>The journey begins in</h3>
  <h2>Mission Launch Countdown</h2>
  <div class="countdown">
    <div class="cd-box"><div class="cd-num" id="cd-days">00</div><div class="cd-label">Days</div></div>
    <div class="cd-box"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">Hours</div></div>
    <div class="cd-box"><div class="cd-num" id="cd-mins">00</div><div class="cd-label">Minutes</div></div>
    <div class="cd-box"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">Seconds</div></div>
  </div>
</div>

<!-- MISSION / AGENDA SECTION -->
<div class="section" id="mission">
  <img src="assets/asset_png_002.png" alt="Mission Schedule">
</div>

<!-- VIDEO SECTION -->
<div class="video-section">
  <h2>Welcome to your mission</h2>
  <h1>THE MESSAGE</h1>
  <div class="video-wrapper">
    <video controls playsinline>
      <source src="assets/asset_mp4_001.mp4" type="video/mp4">
    </video>
  </div>
</div>

<!-- KENNEDY SECTION -->
<div class="section" id="kennedy">
  <img src="assets/asset_png_003.png" alt="Kennedy Space Center">
</div>
<div class="section">
  <img src="assets/asset_png_004.png" alt="Kennedy Info">
</div>

<!-- SPEAKERS SECTION -->
<div class="speakers-section" id="speakers">
  <div class="speakers-track" id="speakersTrack">
    <div class="speaker-slide">
      <img src="assets/asset_png_005.png" alt="Jim Knight">
    </div>
    <div class="speaker-slide">
      <img src="assets/asset_png_006.png" alt="Michael Baker">
    </div>
  </div>
  <button class="speaker-next" onclick="nextSpeaker()" aria-label="Next speaker">
    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
  </button>
</div>

<!-- MOMENTS / GALLERY SECTION -->
<div class="section" id="moments">
  <img src="assets/asset_png_007.png" alt="Moments from the Mission">
</div>

<!-- CONTACT / WHATSAPP -->
<div class="contact-section">
  <h3>Need assistance?</h3>
  <h2>We're here for you</h2>
  <a class="wa-cta" href="https://wa.me/17875978022" target="_blank">

    Chat with us on WhatsApp
  </a>
</div>

<!-- CLOSING SECTION -->
<div class="section">
  <img src="assets/asset_png_008.png" alt="We'll See You Beyond the Stars">
</div>

<!-- FOOTER -->
<div class="footer">
  <img src="assets/asset_png_009.png" alt="American Express">
</div>

<!-- WHATSAPP FLOAT BUTTON -->
<a class="wa-btn" href="https://wa.me/17875978022" target="_blank" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>

<script>
  function scrollToSection(id) {
    document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
  }

  // Speakers slider — click to advance, no auto-rotate
  let currentSlide = 0;
  const totalSlides = 2;
  function nextSpeaker() {
    currentSlide = (currentSlide + 1) % totalSlides;
    document.getElementById('speakersTrack').style.transform = `translateX(-${currentSlide * 100}%)`;
  }

  // Live Countdown — May 14, 2026, 3:00 PM Eastern Time
  // 3 PM EDT = 19:00 UTC
  const targetDate = new Date('2026-05-14T19:00:00Z').getTime();
  function updateCountdown() {
    const now = new Date().getTime();
    let diff = targetDate - now;
    if (diff < 0) diff = 0;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
    document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
    document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
